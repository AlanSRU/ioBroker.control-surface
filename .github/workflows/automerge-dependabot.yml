# Auto-merges Dependabot PRs according to the rules in .github/auto-merge.yml.
#
# Replaces the scaffold's dependabot-auto-merge.yml, which used
# ahmadnassri/action-dependabot-auto-merge — that action no longer works.

name: Auto-Merge Dependabot PRs

on:
  # Trigger when a PR is opened or updated.
  # WARNING: This runs in the PR base. DO NOT build untrusted code in this action.
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run if actor is dependabot
    if: github.actor == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge Dependabot PRs
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
