# Cron rather than a monthly interval so the two ecosystems do not open PRs on
# the same day, and so the load is not synchronised with every other adapter.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '23 4 9 * *'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    versioning-strategy: increase
    assignees:
      - AlanSRU
    # A new release has to have been public for a week before it is proposed,
    # which is the cheapest defence there is against a compromised publish.
    cooldown:
      default-days: 7
    # Majors of the toolchain are a deliberate migration, not a dependency bump.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@iobroker/eslint-config'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '47 5 16 * *'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    assignees:
      - AlanSRU
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
